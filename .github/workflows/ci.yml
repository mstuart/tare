name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ultracite:
    name: Ultracite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Node.js dependencies
        working-directory: npm
        run: npm install --ignore-scripts
      - name: Ultracite check
        working-directory: npm
        run: npm run check

  check:
    name: fmt · clippy · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build (release)
        run: cargo build --workspace --release

  npm:
    name: npm adapters · package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test JS adapters
        working-directory: npm
        run: npm test
      - name: Validate npm package
        working-directory: npm
        run: npm pack --dry-run

  python:
    name: Python integrations · package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: Swatinem/rust-cache@v2
      - name: Create Python test environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip maturin pytest
      - name: Build Python extension for tests
        run: .venv/bin/python -m maturin develop -m crates/tare-py/Cargo.toml
      - name: Test Python integrations
        run: .venv/bin/python -m pytest crates/tare-py/tests
      - name: Validate Python package
        run: .venv/bin/python -m maturin build --sdist --out dist -m crates/tare-py/Cargo.toml

  packages:
    name: Rust packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate publishable Rust packages
        run: |
          cargo package --list -p tare-tokenize >/dev/null
          cargo package --list -p tare-cache >/dev/null
          cargo package --list -p tare-core >/dev/null
          cargo package --list -p tare-memory >/dev/null
          cargo package --list -p tare-cli >/dev/null
          cargo package --list -p tare-proxy >/dev/null
          cargo package --list -p tare-mcp >/dev/null

  deny:
    name: cargo-deny (licenses · advisories · bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tare-proxy:ci
