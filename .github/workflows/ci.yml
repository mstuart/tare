name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ultracite:
    name: Ultracite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Install Node.js dependencies
        working-directory: npm
        run: npm install --ignore-scripts
      - name: Ultracite check
        working-directory: npm
        run: npm run check

  check:
    name: fmt · clippy · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build (release)
        run: cargo build --workspace --release

  npm:
    name: npm adapters · package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Test JS adapters
        working-directory: npm
        run: npm test
      - name: Validate npm package
        working-directory: npm
        run: npm pack --dry-run

  python:
    name: Python integrations · package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Create Python test environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip maturin pytest
      - name: Build Python extension for tests
        run: .venv/bin/python -m maturin develop -m crates/tare-py/Cargo.toml
      - name: Test Python integrations
        run: .venv/bin/python -m pytest crates/tare-py/tests
      - name: Validate Python package
        run: .venv/bin/python -m maturin build --sdist --out dist -m crates/tare-py/Cargo.toml

  packages:
    name: Rust packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Validate publishable Rust packages
        run: |
          cargo package --list -p tare-tokenize >/dev/null
          cargo package --list -p tare-cache >/dev/null
          cargo package --list -p tare-core >/dev/null
          cargo package --list -p tare-memory >/dev/null
          cargo package --list -p tare-cli >/dev/null
          cargo package --list -p tare-proxy >/dev/null
          cargo package --list -p tare-mcp >/dev/null

  deny:
    name: cargo-deny (licenses · advisories · bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          tags: tare-proxy:ci
