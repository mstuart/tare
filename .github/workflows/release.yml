name: release

# Build self-contained binaries for each platform and attach them to the GitHub Release, then
# (on a version tag) publish the npm wrapper package. Triggered by a version
# tag, or manually via workflow_dispatch to (re)attach binaries to an existing release.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach binaries to (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14      # Apple silicon
            target: aarch64-apple-darwin
          - os: macos-14      # cross-compile Intel on Apple silicon (macos-13 runners are scarce/queued)
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p tare-cli -p tare-proxy -p tare-mcp
      - name: Package
        id: package
        shell: bash
        run: |
          asset="tare-${{ matrix.target }}.tar.gz"
          out="target/${{ matrix.target }}/release"
          tar -czf "$asset" -C "$out" tare tare-proxy tare-mcp
          shasum -a 256 "$asset" > "$asset.sha256"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          # Create the release on first contact (concurrent matrix jobs race; losers fall
          # through to the upload, which fails loudly if the release truly doesn't exist).
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "tare $tag" \
                 --verify-tag --generate-notes || true
          gh release upload "$tag" \
            "${{ steps.package.outputs.asset }}" \
            "${{ steps.package.outputs.asset }}.sha256" \
            --clobber --repo "$GITHUB_REPOSITORY"

  npm-publish:
    name: publish npm
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish to npm (idempotent)
        working-directory: npm
        shell: bash
        run: |
          # Sync the package version to the tag and skip if it is already on npm (idempotent).
          case "$GITHUB_REF" in
            refs/tags/*) npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}" ;;
          esac
          ver="$(node -p "require('./package.json').version")"
          if npm view "tare-ai@${ver}" version >/dev/null 2>&1; then
            echo "tare-ai@${ver} is already published — skipping."
            exit 0
          fi
          npm publish --access public
