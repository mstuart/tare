name: crates-io

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Use the temporary crates.io token for first publication
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Authenticate with crates.io
        if: ${{ !inputs.bootstrap }}
        id: auth
        uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4

      - name: Validate bootstrap token
        if: ${{ inputs.bootstrap }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: test -n "$CARGO_REGISTRY_TOKEN"

      - name: Publish crates to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ inputs.bootstrap && secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
        shell: bash
        run: |
          cargo publish -p tare-tokenize --no-verify
          sleep 20
          cargo publish -p tare-cache --no-verify
          sleep 20
          cargo publish -p tare-core --no-verify
          sleep 20
          cargo publish -p tare-memory --no-verify
          sleep 20
          cargo publish -p tare-cli --no-verify
          sleep 20
          cargo publish -p tare-proxy --no-verify
          sleep 20
          cargo publish -p tare-mcp --no-verify
